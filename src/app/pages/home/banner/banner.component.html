
@if(role == roles.GUEST){
  <div class="landing-guest">
    <div id="center">
      <h1 class=" text-[46px] leading-[54.48px] sm:text-[28px] sm:leading-[70.82px] sm:font-light md:text-[52px] ftSizemobile fontLetra " >¡Bienvenido a Soy Zen!</h1>

      <h3 class="font-semibold text-[16px] leading-[24px] sm:text-[20px] md:text-[18px] sm:leading-[32px] sm:font-semibold marginMobile font-[600]" >Realiza nuestro test y obtén un programa especial de 5 días.</h3>

      <button class="btn-white !text-[16px] mt-3" [routerLink]="['/test-constructor']" >Comenzar mi camino</button>
    </div>

  </div>
}
@else if(role == roles.REGISTER){
  <div class="landing-freemium">
    <div class="grid gap-2">
      <div class="flex items-center">
        <span class="!font-semibold text-[24px] leading-[32px] sm:text-[28px] sm:leading-[32px]" >Hola</span>
        <span class="!font-normal text-[24px] leading-[32px] sm:text-[28px] sm:leading-[32px]">, {{name}}</span>
      </div>
      <mat-divider />
    </div>

    <div class="grid gap-4 py-16">
      <span class=" text-[28px] leading-[38.14px] sm:text-[52px] sm:leading-[70.82px] fontLetra">Programa de 5 días</span>
      <h3 class=" text-[16px] leading-[22px] sm:text-[18px] sm:leading-[32px] font-[600]">Ya puedes disfrutar de tu programa personalizado.</h3>

      <button class="btn-white !text-[14px] !leading-[19.6px] sm:!text-[16px] sm:!leading-[22.4px] font-bold" id="see-program" routerLink="../test-constructor"  >Ver Programa</button>
    </div>
  </div>
}
@else {
  <div class="flex items-center ml-[14px] mt-[35px]">
    <span class="!font-semibold text-[24px] leading-[32px] sm:text-[28px] sm:leading-[32px] paddinsjl" >Hola</span>
    <span class="!font-normal text-[24px] leading-[32px] sm:text-[28px] sm:leading-[32px]" *ngIf="name">, {{name}}</span>
  </div>
}
